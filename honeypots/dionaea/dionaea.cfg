# Dionaea Configuration - IoT Malware Capture Honeypot
# Emulates services commonly targeted by IoT botnets (Mirai variants, Mozi)

[core]
# Enable JSON logging for structured ingestion
logging = json

[modules]
# Protocol handlers enabled for IoT botnet capture
# SMB - captures EternalBlue-style exploits, ransomware droppers
services/smb = true
# FTP - captures malware upload/download attempts  
services/ftp = true
# HTTP - captures web shell uploads, exploit kits
services/http = true
# MySQL - captures SQL injection payloads, botnet C2
services/mysql = true
# MQTT - captures IoT-specific botnet probes (Mirai variants)
services/mqtt = true
# TFTP - captures firmware download attempts
services/tftp = true
# Memcache - captures amplification attack payloads
services/memcache = true

[logging]
# Structured JSON output for ELK pipeline
default.filename = /opt/dionaea/var/dionaea/log/dionaea.json
default.levels = all
default.domains = *

[processor]
# Capture all downloaded binaries for malware analysis
# Store in structured directory: YYYY/MM/DD/hash.ext
scripts = ["store.py"]
store.dir = /opt/dionaea/var/dionaea/bistreams
store.pattern = %Y/%m/%d/%H/%M/%S-%h-%i-%p-%H.%m.%s.%f-%n.%e

[services]
# SMB - Windows file sharing (ransomware entry point)
smb.enabled = true
smb.port = 445
# FTP - legacy protocol still targeted by IoT worms
ftp.enabled = true
ftp.port = 21
# HTTP - web services on IoT devices
http.enabled = true
http.port = 80
# MySQL - database services on NAS/DVR devices
mysql.enabled = true
mysql.port = 3306
# MQTT - IoT messaging protocol (critical for modern botnets)
mqtt.enabled = true
mqtt.port = 1883
# TFTP - firmware update protocol
tftp.enabled = true
tftp.port = 69
# Memcache - amplification DDoS vector
memcache.enabled = true
memcache.port = 11211

[virustotal]
# Optional: Submit hashes to VirusTotal for enrichment
# Requires API key in environment
enabled = false
api_key = ${VIRUSTOTAL_API_KEY}
