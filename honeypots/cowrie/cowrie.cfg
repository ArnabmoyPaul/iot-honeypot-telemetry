# Cowrie Configuration - IoT Honeypot (Hikvision IP Camera Emulation)
# Based on research: IMC 2025 "Long-Term Observations in an SSH Honeynet"
# Modified to resist fingerprinting by removing default fake accounts

[honeypot]
# Device identity - mimics Hikvision IP Camera
hostname = Hikvision-DS-2CD2143G2-I
# Realistic Linux kernel for embedded ARM device
kernel_version = Linux version 3.10.65+ (builder@arm-build) (gcc version 4.8.3 20140320 (prerelease) )
kernel_build_string = #1 SMP PREEMPT Thu Mar 10 15:58:07 CST 2016
hardware_platform = armv7l
# Realistic architecture
arch = armv7l

[ssh]
# Use dropbear banner to mimic real IoT device
version = SSH-2.0-dropbear_2016.74
# Listen on all interfaces within container
listen_endpoints = tcp:2222:interface=0.0.0.0
# Enable SFTP for realistic file transfer capture
sftp_enabled = true
# Enable forwarding to capture tunneling attempts
forwarding = true

[telnet]
listen_endpoints = tcp:2223:interface=0.0.0.0

[output_json]
# Structured JSON logging for ELK pipeline ingestion
logfile = /cowrie/cowrie-git/var/log/cowrie/cowrie.json
# Enable event_id for session correlation
event_id = true

[output_jsonlog]
logfile = /cowrie/cowrie-git/var/log/cowrie/cowrie.json

[database_sqlite]
# Local SQLite for quick lookups, not primary storage
enabled = false

[database_redis]
enabled = false

[shell]
# Use default shell filesystem (customized in Dockerfile)
filesystem = /cowrie/cowrie-git/share/cowrie/fs.pickle
# Realistic command timeout for slow embedded CPU
command_timeout = 30

[download]
# Capture all downloaded payloads for malware analysis
enabled = true
outdir = /cowrie/cowrie-git/var/lib/cowrie/downloads

[ttylog]
enabled = true
logfile = /cowrie/cowrie-git/var/log/cowrie/tty/

[daemon]
# Do NOT daemonize - Docker handles process management
pidfile =
umask = 0022

[database_mysql]
enabled = false

[database_mongodb]
enabled = false

[database_elasticsearch]
enabled = false
