# Elasticsearch Configuration - Honeypot Telemetry
# Single-node deployment for development and research

cluster.name: honeypot-telemetry
node.name: es-node-1

# Single-node discovery (no cluster)
discovery.type: single-node

# Security settings
xpack.security.enabled: true
xpack.security.enrollment.enabled: false
xpack.security.http.ssl.enabled: false
xpack.security.transport.ssl.enabled: false

# Memory and performance
bootstrap.memory_lock: true
indices.memory.index_buffer_size: 10%

# Index lifecycle management (ILM) for log retention
xpack.ilm.enabled: true

# Path settings
path.data: /usr/share/elasticsearch/data
path.logs: /usr/share/elasticsearch/logs

# Network
network.host: 0.0.0.0
http.port: 9200
transport.port: 9300

# CORS for Kibana (if needed)
http.cors.enabled: true
http.cors.allow-origin: "*"
