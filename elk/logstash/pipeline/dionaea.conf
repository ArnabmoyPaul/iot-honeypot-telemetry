input {
  beats {
    port => 5044
    type => "beats"
  }
}

filter {
  # Only process Dionaea events
  if [fields][type] == "dionaea" or [log][file][path] =~ "dionaea" {
    # Parse JSON log line
    json {
      source => "message"
      target => "dionaea"
      skip_on_invalid_json => true
    }

    # Extract timestamp
    if [dionaea][timestamp] {
      date {
        match => [ "[dionaea][timestamp]", "ISO8601" ]
        target => "@timestamp"
      }
    }

    # Extract source IP
    if [dionaea][src_ip] {
      mutate {
        add_field => { "src_ip" => "%{[dionaea][src_ip]}" }
      }
    }

    # Extract protocol/service
    if [dionaea][protocol] {
      mutate {
        add_field => { "protocol" => "%{[dionaea][protocol]}" }
      }
    }

    # Extract event type
    if [dionaea][event_type] {
      mutate {
        add_field => { "event_type" => "%{[dionaea][event_type]}" }
      }
    }

    # Extract MQTT-specific fields
    if [dionaea][client_id] {
      mutate {
        add_field => { "mqtt_client_id" => "%{[dionaea][client_id]}" }
      }
    }
    if [dionaea][topic] {
      mutate {
        add_field => { "mqtt_topic" => "%{[dionaea][topic]}" }
      }
    }

    # Payload analysis
    if [dionaea][message_length] {
      mutate {
        add_field => { "payload_size" => "%{[dionaea][message_length]}" }
        convert => { "payload_size" => "integer" }
      }
    }

    # Suspicious flag
    if [dionaea][suspicious] {
      mutate {
        add_field => { "is_suspicious" => "%{[dionaea][suspicious]}" }
        convert => { "is_suspicious" => "boolean" }
      }
    }

    # Add honeypot metadata
    mutate {
      add_field => {
        "honeypot_type" => "dionaea"
      }
    }

    # Remove raw message
    mutate {
      remove_field => [ "message" ]
    }
  }
}

output {
  if [honeypot_type] == "dionaea" {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      user => "logstash_internal"
      password => "${LOGSTASH_INTERNAL_PASSWORD}"
      index => "honeypot-logs-dionaea-%{+YYYY.MM.dd}"
      template_name => "honeypot-logs"
      template_overwrite => false
    }
  }
}
