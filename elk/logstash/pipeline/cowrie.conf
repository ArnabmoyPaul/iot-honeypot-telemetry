input {
  beats {
    port => 5044
    type => "beats"
  }
}

filter {
  # Only process Cowrie events
  if [fields][type] == "cowrie" or [log][file][path] =~ "cowrie" {
    # Parse JSON log line
    json {
      source => "message"
      target => "cowrie"
      skip_on_invalid_json => true
    }

    # Extract timestamp from event
    date {
      match => [ "[cowrie][timestamp]", "ISO8601" ]
      target => "@timestamp"
    }

    # Extract source IP for GeoIP enrichment
    if [cowrie][src_ip] {
      mutate {
        add_field => { "src_ip" => "%{[cowrie][src_ip]}" }
      }
    }

    # Extract session ID for correlation
    if [cowrie][session] {
      mutate {
        add_field => { "session_id" => "%{[cowrie][session]}" }
      }
    }

    # Extract event type
    if [cowrie][eventid] {
      mutate {
        add_field => { "event_type" => "%{[cowrie][eventid]}" }
      }
    }

    # Extract username/password from login attempts
    if [cowrie][username] {
      mutate {
        add_field => { "username" => "%{[cowrie][username]}" }
      }
    }
    if [cowrie][password] {
      mutate {
        add_field => { "password" => "%{[cowrie][password]}" }
      }
    }

    # Extract executed commands
    if [cowrie][input] {
      mutate {
        add_field => { "command" => "%{[cowrie][input]}" }
      }
    }

    # Extract downloaded URLs
    if [cowrie][url] {
      mutate {
        add_field => { "malware_url" => "%{[cowrie][url]}" }
      }
    }

    # Extract sensor name (honeypot identifier)
    if [cowrie][sensor] {
      mutate {
        add_field => { "sensor" => "%{[cowrie][sensor]}" }
      }
    }

    # Add honeypot metadata
    mutate {
      add_field => {
        "honeypot_type" => "cowrie"
        "protocol" => "ssh"
      }
    }

    # Remove raw message to save space
    mutate {
      remove_field => [ "message" ]
    }
  }
}

output {
  if [honeypot_type] == "cowrie" {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      user => "logstash_internal"
      password => "${LOGSTASH_INTERNAL_PASSWORD}"
      index => "honeypot-logs-cowrie-%{+YYYY.MM.dd}"
      template_name => "honeypot-logs"
      template_overwrite => false
    }
  }
}
