filter {
  # GeoIP enrichment for all honeypot events with src_ip
  if [src_ip] and [src_ip] !~ "^(10\.|172\.(1[6-9]|2[0-9]|3[01])\.|192\.168\.|127\.)" {
    geoip {
      source => "src_ip"
      target => "geoip"
      database => "/usr/share/logstash/geoip/GeoLite2-City.mmdb"
      fields => ["city_name", "country_name", "country_code2", "location", "region_name"]
      add_field => {
        "[geoip][lat]" => "%{[geoip][location][lat]}"
        "[geoip][lon]" => "%{[geoip][location][lon]}"
      }
    }

    # ASN lookup (if database available)
    # geoip {
    #   source => "src_ip"
    #   target => "geoip_asn"
    #   database => "/usr/share/logstash/geoip/GeoLite2-ASN.mmdb"
    # }
  }

  # Add deception score enrichment (runs every 5 minutes via cron)
  # This is a placeholder for the Python script output
  if [deception_score] {
    mutate {
      add_field => { "deception_risk" => "%{[deception_score][risk_level]}" }
      add_field => { "deception_overall" => "%{[deception_score][overall_score]}" }
    }
  }
}
