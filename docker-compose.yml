version: "3.8"

networks:
  honeynet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24

volumes:
  cowrie-logs:
    driver: local
  dionaea-logs:
    driver: local
  dionaea-bistreams:
    driver: local
  es-data:
    driver: local

services:
  cowrie:
    build: ./honeypots/cowrie
    container_name: cowrie
    restart: unless-stopped
    ports:
      - "2222:2222"
      - "2223:2223"
    volumes:
      - cowrie-logs:/cowrie/cowrie-git/var/log/cowrie
    networks:
      honeynet:
        ipv4_address: 172.20.0.10
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    mem_limit: 512m
    cpus: "1.0"
    environment:
      - HONEYPOT_HOSTNAME=${HONEYPOT_HOSTNAME:-Hikvision-DS-2CD2143G2-I}

  dionaea:
    build: ./honeypots/dionaea
    container_name: dionaea
    restart: unless-stopped
    ports:
      - "445:445"
      - "21:21"
      - "80:80"
      - "3306:3306"
      - "1883:1883"
    volumes:
      - dionaea-logs:/opt/dionaea/var/dionaea/log
      - dionaea-bistreams:/opt/dionaea/var/dionaea/bistreams
    networks:
      honeynet:
        ipv4_address: 172.20.0.11
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    mem_limit: 512m
    cpus: "1.0"

  elasticsearch:
    build: ./elk/elasticsearch
    container_name: elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks:
      honeynet:
        ipv4_address: 172.20.0.40
    mem_limit: 2g
    cpus: "1.5"

  logstash:
    build: ./elk/logstash
    container_name: logstash
    restart: unless-stopped
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - LOGSTASH_INTERNAL_PASSWORD=${LOGSTASH_INTERNAL_PASSWORD}
    volumes:
      - ./elk/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./elk/logstash/patterns:/usr/share/logstash/patterns:ro
      - ./data/geoip:/usr/share/logstash/geoip:ro
      - cowrie-logs:/var/log/cowrie:ro
      - dionaea-logs:/var/log/dionaea:ro
    networks:
      honeynet:
        ipv4_address: 172.20.0.30
    depends_on:
      - elasticsearch
    mem_limit: 1g
    cpus: "1.0"

  kibana:
    build: ./elk/kibana
    container_name: kibana
    restart: unless-stopped
    environment:
      - ELASTICSEARCH_HOSTS=["http://elasticsearch:9200"]
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_PASSWORD}
    ports:
      - "127.0.0.1:5601:5601"
    networks:
      honeynet:
        ipv4_address: 172.20.0.50
    depends_on:
      - elasticsearch
    mem_limit: 512m
    cpus: "0.5"

  filebeat:
    build: ./elk/filebeat
    container_name: filebeat
    restart: unless-stopped
    user: root
    volumes:
      - ./elk/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - cowrie-logs:/var/log/cowrie:ro
      - dionaea-logs:/var/log/dionaea:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      honeynet:
        ipv4_address: 172.20.0.20
    depends_on:
      - logstash
    mem_limit: 256m
    cpus: "0.5"
